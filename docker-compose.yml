services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Embeddings run in-process via sentence-transformers (no Ollama needed).
  # LLM inference runs on the host via llama-server directly:
  #   llama-server --model /path/to/model.gguf --n-gpu-layers 14 --port 8080
  # See ~/proj/priv/llama-server.env for the active model configuration.

volumes:
  qdrant_data:
