[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-legal-rag"
version = "0.2.0"
description = "On-premise RAG pipeline for NZ court decisions and legislation"
requires-python = ">=3.11"
dependencies = [
    "astraea-framework>=0.2.0",
    "mcp>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "pytesseract>=0.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ragas>=0.1",
    "datasets>=2.19",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "retrieval: Tier 1 - Qdrant only, no LLM required",
    "structural: Tier 2 - LLM required, non-semantic (budget, citations, routing)",
    "llm: Tier 3 - LLM required, semantic answer quality checks",
]
