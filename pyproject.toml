[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nz-legal-rag"
version = "0.1.0"
description = "On-premise RAG pipeline for NZ court decisions and legislation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "ragas>=0.1",
    "datasets>=2.19",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
